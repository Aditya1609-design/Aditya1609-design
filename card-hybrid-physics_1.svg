<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-label="Hybrid physics engine: soft-body simulation that switches between a GNN and a classical solver. Opens the repository." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .pa, .ba rect { animation: a 4s steps(1) infinite; }
  .pb, .bb rect { animation: b 4s steps(1) infinite; }
  @keyframes a { 0% { stroke: #f0a044; stroke-width: 2; } 50% { stroke: #4b5768; stroke-width: 1.3; } }
  @keyframes b { 0% { stroke: #4b5768; stroke-width: 1.3; } 50% { stroke: #f0a044; stroke-width: 2; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x=".5" y=".5" width="879" height="269" rx="16" fill="#1b2027" stroke="#343d49"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="32" y="46" font-size="24" font-weight="650" fill="#e8edf3">Hybrid physics engine</text>
  <rect x="747.4" y="26" width="102.6" height="24" rx="12" fill="#2a313b" stroke="#4b5768"/><circle cx="760.4" cy="38" r="3.5" fill="#f0a044"/><text x="769.4" y="42.5" font-size="12" fill="#e8edf3">In progress</text><rect x="600.6" y="26" width="138.8" height="24" rx="12" fill="#2a313b" stroke="#4b5768"/><text x="670.0" y="42.5" text-anchor="middle" font-size="12" fill="#e8edf3">Final-year project</text>
  <rect x="34" y="90" width="6" height="6" rx="1" fill="#f0a044"/><text x="52" y="98" font-size="14" fill="#b3bdca">C++17 engine for real-time 3D soft-body dynamics</text><rect x="34" y="124" width="6" height="6" rx="1" fill="#f0a044"/><text x="52" y="132" font-size="14" fill="#b3bdca">Uses a Graph Neural Network when it is confident</text><rect x="34" y="158" width="6" height="6" rx="1" fill="#f0a044"/><text x="52" y="166" font-size="14" fill="#b3bdca">Falls back to a classical solver when it is not</text><rect x="34" y="192" width="6" height="6" rx="1" fill="#f0a044"/><text x="52" y="200" font-size="14" fill="#b3bdca">Built phase by phase with my teammate at DTU</text>
  <rect x="470" y="70" width="380" height="156" rx="12" fill="#222831" stroke="#2c333d"/>
  <text x="486" y="92" font-size="11" fill="#7f8b9b">How each step is solved</text>
  <line x1="510" y1="130" x2="532" y2="130" stroke="#5d6b7e"/><line x1="510" y1="130" x2="510" y2="152" stroke="#5d6b7e"/><line x1="510" y1="130" x2="532" y2="152" stroke="#5d6b7e" stroke-opacity=".45"/><line x1="532" y1="130" x2="554" y2="130" stroke="#5d6b7e"/><line x1="532" y1="130" x2="532" y2="152" stroke="#5d6b7e"/><line x1="532" y1="130" x2="554" y2="152" stroke="#5d6b7e" stroke-opacity=".45"/><line x1="554" y1="130" x2="554" y2="152" stroke="#5d6b7e"/><line x1="510" y1="152" x2="532" y2="152" stroke="#5d6b7e"/><line x1="510" y1="152" x2="510" y2="174" stroke="#5d6b7e"/><line x1="510" y1="152" x2="532" y2="174" stroke="#5d6b7e" stroke-opacity=".45"/><line x1="532" y1="152" x2="554" y2="152" stroke="#5d6b7e"/><line x1="532" y1="152" x2="532" y2="174" stroke="#5d6b7e"/><line x1="532" y1="152" x2="554" y2="174" stroke="#5d6b7e" stroke-opacity=".45"/><line x1="554" y1="152" x2="554" y2="174" stroke="#5d6b7e"/><line x1="510" y1="174" x2="532" y2="174" stroke="#5d6b7e"/><line x1="532" y1="174" x2="554" y2="174" stroke="#5d6b7e"/><circle cx="510" cy="130" r="3.2" fill="#e8edf3"/><circle cx="532" cy="130" r="3.2" fill="#e8edf3"/><circle cx="554" cy="130" r="3.2" fill="#e8edf3"/><circle cx="510" cy="152" r="3.2" fill="#e8edf3"/><circle cx="532" cy="152" r="3.2" fill="#e8edf3"/><circle cx="554" cy="152" r="3.2" fill="#e8edf3"/><circle cx="510" cy="174" r="3.2" fill="#e8edf3"/><circle cx="532" cy="174" r="3.2" fill="#e8edf3"/><circle cx="554" cy="174" r="3.2" fill="#e8edf3"/><text x="532" y="196" text-anchor="middle" font-size="10.5" fill="#7f8b9b">soft body</text><path d="M562 152 H631" fill="none" stroke="#5d6b7e" stroke-width="1.3" class=""/><path d="M648 135 L665 152 L648 169 L631 152 Z" fill="#2a313b" stroke="#4b5768"/><text x="648" y="157" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#e8edf3">σ</text><text x="648" y="188" text-anchor="middle" font-size="10.5" fill="#7f8b9b">uncertainty</text><path d="M665 152 H688 V118 H734" fill="none" stroke="#5d6b7e" stroke-width="1.3" class="pa"/><path d="M665 152 H688 V186 H734" fill="none" stroke="#5d6b7e" stroke-width="1.3" class="pb"/><g class="ba"><rect x="734.0" y="105" width="72" height="26" rx="13" fill="#2a313b" stroke="#4b5768"/><text x="770" y="122.5" text-anchor="middle" font-size="12" fill="#e8edf3">GNN</text></g><g class="bb"><rect x="734.0" y="173" width="72" height="26" rx="13" fill="#2a313b" stroke="#4b5768"/><text x="770" y="190.5" text-anchor="middle" font-size="12" fill="#e8edf3">solver</text></g><text x="770" y="97" text-anchor="middle" font-size="10.5" fill="#7f8b9b">fast, when confident</text><text x="770" y="216" text-anchor="middle" font-size="10.5" fill="#7f8b9b">exact, when not</text>
  <line x1="32" y1="230" x2="850" y2="230" stroke="#2c333d"/>
  <text x="32" y="253" font-size="12" fill="#7f8b9b">C++17, Graph Neural Networks</text>
</g>
</svg>