<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Aditya Yadav</title>
<desc id="d">A soft-body block made of masses and springs drops onto a floor and wobbles to rest, next to the text: I build backends, AI pipelines and a soft-body physics engine in C++.</desc>
<style>
  .struct { stroke: #b7cde8; stroke-width: 1.3; }
  .shear  { stroke: #b7cde8; stroke-width: 0.8; opacity: .55; }
  .node   { fill: #ffffff; }
  .hatch  { stroke: #9db6d6; stroke-width: 1; opacity: .6; }
  .block  { transform-box: fill-box; transform-origin: 50% 100%; animation: drop 7s cubic-bezier(.5,0,.5,1) infinite; }
  .shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow 7s cubic-bezier(.5,0,.5,1) infinite; }
  .pulse  { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes drop {
    0%   { transform: translateY(-80px) scale(1,1); opacity: 0; animation-timing-function: ease-in; }
    5%   { opacity: 1; }
    16%  { transform: translateY(0) scale(1,1); animation-timing-function: ease-out; }
    21%  { transform: translateY(0) scale(1.14,.82); }
    28%  { transform: translateY(0) scale(.93,1.08); }
    35%  { transform: translateY(0) scale(1.05,.96); }
    42%  { transform: translateY(0) scale(.98,1.02); }
    49%  { transform: translateY(0) scale(1,1); }
    86%  { transform: translateY(0) scale(1,1); opacity: 1; }
    94%  { transform: translateY(0) scale(1,1); opacity: 0; }
    100% { transform: translateY(-80px) scale(1,1); opacity: 0; }
  }
  @keyframes shadow {
    0%   { transform: scale(.35,1); opacity: 0; animation-timing-function: ease-in; }
    16%  { transform: scale(1,1); opacity: .5; }
    21%  { transform: scale(1.15,1); }
    28%  { transform: scale(.94,1); }
    49%  { transform: scale(1,1); }
    86%  { opacity: .5; }
    94%,100% { transform: scale(1,1); opacity: 0; }
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .block, .shadow, .pulse { animation: none; } }
</style>
<defs>
  <pattern id="fine" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
  </pattern>
  <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
    <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
  </pattern>
</defs>

